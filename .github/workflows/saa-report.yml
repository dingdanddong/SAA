name: SAA 리포트

on:
  schedule:
    - cron: "30 23 * * 0-4" # 평일 08:30 KST 모닝 브리프
    - cron: "30 6 * * 1-5" # 평일 15:30 KST 결산 리포트
  workflow_dispatch:
    inputs:
      mode:
        description: 실행 모드
        type: choice
        options: [evening, morning]
        default: evening
      dry_run:
        description: 메일을 보내지 않고 리포트만 생성
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '30 23 * * 0-4' && 'morning' || 'evening') }}
      EXTRA_ARGS: ${{ github.event_name == 'workflow_dispatch' && format('--force {0}', inputs.dry_run && '--dry-run' || '') || '' }}
      MY_SECRET_KEY: ${{ secrets.MY_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Secret MY_SECRET_KEY 에는 secrets.json 전체 내용을 넣는다. 값은 출력하지 않고 키 이름만 점검한다
      - name: secrets.json 생성·점검
        run: |
          printf '%s' "$MY_SECRET_KEY" > secrets.json
          python - <<'EOF'
          import json, sys
          try:
              d = json.load(open("secrets.json", encoding="utf-8"))
          except ValueError:
              sys.exit("MY_SECRET_KEY 가 비어 있거나 JSON 형식이 아닙니다 (secrets.json 전체 내용을 붙여넣어야 함)")
          for k in ("GEMINI_API_KEY", "DART_API_KEY", "GMAIL_USER", "GMAIL_APP_PASSWORD", "REPORT_TO", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "GOOGLE_REFRESH_TOKEN"):
              print(k, "설정됨" if str(d.get(k) or "").strip() else "비어 있음")
          EOF

      # 전일 시나리오 검증·모닝 갭 후보에 쓰는 data/ 를 실행 간에 이어받는다
      - name: 이전 실행 기록 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            !data/outbox
          key: saa-data-${{ github.run_id }}
          restore-keys: saa-data-

      - name: 리포트 실행
        run: python main_pipeline.py --mode "$MODE" $EXTRA_ARGS

      - name: 실행 기록 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            !data/outbox
          key: saa-data-${{ github.run_id }}

      - name: 리포트 HTML 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: data/outbox
          if-no-files-found: ignore
          retention-days: 7
